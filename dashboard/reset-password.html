<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://wndqubtncxtbninmojpx.supabase.co wss://wndqubtncxtbninmojpx.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password — Baggle</title>
<meta name="description" content="Choose a new password for your Baggle account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="dashboard.min.css">
</head>
<body>

<section class="auth-screen" id="view-reset">
  <div class="auth-box">
    <img class="auth-logo" src="/brand/logo-bag.png" alt="Baggle" width="125" height="132">
    <p class="auth-tagline" id="resetTagline">Checking your link…</p>

    <div id="resetForm" hidden>
      <label class="field-label">New password</label>
      <input id="newPassword" class="field-input" type="password" placeholder="At least 8 characters" autocomplete="new-password">
      <label class="field-label">Confirm new password</label>
      <input id="confirmPassword" class="field-input" type="password" placeholder="Re-type the password" autocomplete="new-password">
      <p class="auth-error" id="resetError"></p>
      <p class="auth-notice" id="resetNotice"></p>
      <button id="resetSubmitBtn" class="btn-pill solid full">Set new password</button>
    </div>

    <div id="resetInvalid" hidden>
      <p class="auth-error">This link is invalid or has expired — go back and request a new one.</p>
      <p class="auth-switch"><a class="link-btn" href="index.html">Back to sign in</a></p>
    </div>

    <div id="resetDone" hidden>
      <p class="auth-notice">Your password has been updated.</p>
      <p class="auth-switch"><a class="link-btn" href="index.html">Go to sign in</a></p>
    </div>
  </div>
</section>

<script src="supabase.vendor.js"></script>
<script src="reset-password.bundle.min.js"></script>
</body>
</html>
