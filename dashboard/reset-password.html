<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password — Baggle</title>
<meta name="description" content="Choose a new password for your Baggle account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 -5 30 32'%3E%3Crect x='0' y='4' width='22' height='20' rx='5.2' fill='%23FF5C8A' stroke='%233D2A5C' stroke-width='1.4'/%3E%3Cpath d='M6.3 4 v-2.2 a4.8 4.8 0 0 1 9.6 0 v2.2' fill='none' stroke='%233D2A5C' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="dashboard.min.css">
</head>
<body>

<section class="auth-screen" id="view-reset">
  <div class="auth-box">
    <svg class="auth-logo" viewBox="0 -5 30 32" fill="none">
      <rect x="0" y="4" width="22" height="20" rx="5.2" fill="#FF5C8A" stroke="#3D2A5C" stroke-width="1.4"/>
      <path d="M6.3 4 v-2.2 a4.8 4.8 0 0 1 9.6 0 v2.2" fill="none" stroke="#3D2A5C" stroke-width="1.5"/>
    </svg>
    <p class="auth-tagline" id="resetTagline">Checking your link…</p>

    <div id="resetForm" hidden>
      <label class="field-label">New password</label>
      <input id="newPassword" class="field-input" type="password" placeholder="At least 6 characters" autocomplete="new-password">
      <label class="field-label">Confirm new password</label>
      <input id="confirmPassword" class="field-input" type="password" placeholder="Re-type the password" autocomplete="new-password">
      <p class="auth-error" id="resetError"></p>
      <p class="auth-notice" id="resetNotice"></p>
      <button id="resetSubmitBtn" class="btn-pill solid full">Set new password</button>
    </div>

    <div id="resetInvalid" hidden>
      <p class="auth-error">This link is invalid or has expired — go back and request a new one.</p>
      <p class="auth-switch"><a class="link-btn" href="index.html">Back to sign in</a></p>
    </div>

    <div id="resetDone" hidden>
      <p class="auth-notice">Your password has been updated.</p>
      <p class="auth-switch"><a class="link-btn" href="index.html">Go to sign in</a></p>
    </div>
  </div>
</section>

<script src="supabase.vendor.js"></script>
<script src="reset-password.bundle.min.js"></script>
</body>
</html>
